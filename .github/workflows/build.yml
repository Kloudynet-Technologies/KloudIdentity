name: Project Build

on:
  push:
    branches: ["main", "dev", "dev-2.0"]     
  pull_request:
    branches: ["main", "dev", "dev-2.0"]

jobs:
  build-dotnet:
    name: .NET Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Microsoft.SCIM.WebHostSample/

    # Credentials for the private KN.KI.* GitHub Packages feed. The repo nuget.config
    # consumes these via %KLOUDYNET_NUGET_USERNAME% / %KLOUDYNET_NUGET_PASSWORD%
    # (ClearTextPassword) — the same mechanism as local dev, so no `dotnet nuget add source`.
    # KLOUDYNET_NUGET_PASSWORD must be a repo/org Actions secret: a classic PAT with the
    # read:packages scope, SSO-authorized for the Kloudynet-Technologies org.
    env:
      KLOUDYNET_NUGET_USERNAME: ${{ github.actor }}
      KLOUDYNET_NUGET_PASSWORD: ${{ secrets.KLOUDYNET_NUGET_PASSWORD }}

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Run Tests
      working-directory: ./KN.KloudIdentity.MapperTests/
      run: dotnet test KN.KloudIdentity.MapperTests.csproj --logger "console;verbosity=minimal"
        
